<!DOCTYPE html>
<html>
<head>
    <title>Registrar's Office Class Search</title>
</head>
<body>
    <h1>Registrar's Office Class Search</h1>

    <hr>

    <form action="/regoverviews" method="get">
        <table>
            <tbody>
                <tr>
                    <td style="text-align: right">Dept:</td>
                    <td><input type="text" id="dept" name="dept" value="{{ dept }}" autofocus></td>
                </tr>
                <tr>
                    <td style="text-align: right">Number:</td>
                    <td><input type="text" id="coursenum" name="coursenum" value="{{ coursenum }}"></td>
                </tr>
                <tr>
                    <td style="text-align: right">Area:</td>
                    <td><input type="text" id="area" name="area" value="{{ area }}"></td>
                </tr>
                <tr>
                    <td style="text-align: right">Title:</td>
                    <td><input type="text" id="title" name="title" value="{{ title }}"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" id="submitButton" value="Go"></td>
                </tr>
            </tbody>
        </table>
    </form>

    <hr>

    <table id="overviewsTable" border="1">
        <thead>
            <tr>
                <th>ClassId</th>
                <th>Dept</th>
                <th>Num</th>
                <th>Area</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody>
            {% for cls in classes %}
            <tr>
                <td><a href="/regdetails?classid={{ cls.classid }}">{{ cls.classid }}</a></td>
                <td>{{ cls.dept }}</td>
                <td>{{ cls.coursenum }}</td>
                <td>{{ cls.area }}</td>
                <td>{{ cls.title }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        document.getElementById('overviewsTable').setAttribute('rand', Math.random());
    </script>

    <br>
    <hr>

    <p>Created by Ranajoy Gupta.</p>
    
    <hr>
</body>
</html>
